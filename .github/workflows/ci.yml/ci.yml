name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile-check Python sources
        run: python -m py_compile api/*.py tests/*.py
      - name: Run indicator unit tests
        run: python -m unittest discover -s tests -v
